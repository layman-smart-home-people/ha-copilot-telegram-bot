<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot Bot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app" id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <strong>Copilot Bot</strong>
            </div>
            <span class="version" id="version-label">v—</span>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-bar" id="tab-bar">
            <button class="tab-btn active" data-tab="dashboard">
                📊 Dashboard
            </button>
            <button class="tab-btn" data-tab="instructions">
                📋 Instructions
                <span class="badge" id="instr-count">0</span>
            </button>
            <button class="tab-btn" data-tab="docs">
                📚 Docs
            </button>
        </nav>

        <!-- Dashboard Tab -->
        <section class="tab-content active" id="tab-dashboard">
            <div class="card-grid" id="status-cards">
                <!-- Filled by JS -->
            </div>

            <div class="card" style="margin-top: 1rem;">
                <div class="card-title">🔌 Modules</div>
                <ul class="module-list" id="module-list">
                    <!-- Filled by JS -->
                </ul>
            </div>
        </section>

        <!-- Instructions Tab -->
        <section class="tab-content" id="tab-instructions">
            <div class="instr-toolbar">
                <h2 style="font-size: 1.1rem;">Standing Instructions</h2>
                <button class="btn btn-primary" id="btn-new-instr">+ New Instruction</button>
            </div>
            <div class="instr-list" id="instr-list">
                <!-- Filled by JS -->
            </div>
        </section>

        <!-- Docs Tab -->
        <section class="tab-content" id="tab-docs">
            <div class="docs-layout">
                <div class="docs-sidebar">
                    <div class="docs-sidebar-title">Files</div>
                    <ul class="docs-file-list" id="docs-file-list">
                        <!-- Filled by JS -->
                    </ul>
                </div>
                <div class="docs-editor" id="docs-editor">
                    <div class="docs-empty" id="docs-empty">
                        Select a file to view or edit
                    </div>
                    <div id="docs-active" style="display:none; flex-direction:column; flex:1;">
                        <div class="docs-editor-header">
                            <span class="docs-editor-filename" id="docs-filename">—</span>
                            <div style="display:flex; gap:0.5rem;">
                                <button class="btn btn-sm" id="btn-docs-save">💾 Save</button>
                            </div>
                        </div>
                        <div class="docs-editor-content">
                            <textarea id="docs-textarea" spellcheck="false"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Instruction Edit Modal (hidden) -->
    <template id="tmpl-instr-modal">
        <div class="modal-overlay" id="instr-modal">
            <div class="modal">
                <div class="modal-title">
                    <span id="modal-title-text">New Instruction</span>
                    <button class="btn-icon" id="modal-close">&times;</button>
                </div>
                <form id="instr-form">
                    <input type="hidden" id="instr-id" value="">

                    <div class="form-group">
                        <label for="instr-desc">Description</label>
                        <input type="text" id="instr-desc" required placeholder="What does this instruction do?">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="instr-trigger-type">Trigger Type</label>
                            <select id="instr-trigger-type">
                                <option value="state_change">State Change</option>
                                <option value="cron">Cron Schedule</option>
                                <option value="timer">Timer (One-time)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="instr-action-type">Action Type</label>
                            <select id="instr-action-type">
                                <option value="wake_agent">Wake Agent</option>
                                <option value="notify">Notify</option>
                            </select>
                        </div>
                    </div>

                    <!-- State Change fields -->
                    <div id="trigger-state-fields">
                        <div class="form-group">
                            <label for="instr-entity">Entity ID</label>
                            <input type="text" id="instr-entity" placeholder="sensor.temperature">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="instr-from">From State</label>
                                <input type="text" id="instr-from" placeholder="Any (optional)">
                            </div>
                            <div class="form-group">
                                <label for="instr-to">To State</label>
                                <input type="text" id="instr-to" placeholder="Any (optional)">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="instr-above">Above (numeric)</label>
                                <input type="number" id="instr-above" step="any" placeholder="Optional">
                            </div>
                            <div class="form-group">
                                <label for="instr-below">Below (numeric)</label>
                                <input type="number" id="instr-below" step="any" placeholder="Optional">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="instr-attribute">Attribute</label>
                            <input type="text" id="instr-attribute" placeholder="Optional — e.g. brightness">
                        </div>
                    </div>

                    <!-- Cron fields -->
                    <div id="trigger-cron-fields" style="display:none;">
                        <div class="form-group">
                            <label for="instr-cron">Cron Expression</label>
                            <input type="text" id="instr-cron" placeholder="0 8 * * *">
                            <div class="form-hint">min hour day month weekday (0=Sun)</div>
                        </div>
                    </div>

                    <!-- Timer fields -->
                    <div id="trigger-timer-fields" style="display:none;">
                        <div class="form-group">
                            <label for="instr-fire-at">Fire At</label>
                            <input type="datetime-local" id="instr-fire-at">
                        </div>
                    </div>

                    <!-- Action fields -->
                    <div id="action-wake-fields">
                        <div class="form-group">
                            <label for="instr-prompt">Agent Prompt</label>
                            <textarea id="instr-prompt" rows="3" placeholder="What should the agent do?"></textarea>
                        </div>
                    </div>

                    <div id="action-notify-fields" style="display:none;">
                        <div class="form-group">
                            <label for="instr-message">Notification Message</label>
                            <textarea id="instr-message" rows="3" placeholder="Message to send"></textarea>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="instr-cooldown">Cooldown (seconds)</label>
                            <input type="number" id="instr-cooldown" value="300" min="0">
                        </div>
                        <div class="form-group">
                            <label for="instr-max-triggers">Max Triggers</label>
                            <input type="number" id="instr-max-triggers" min="1" placeholder="Unlimited">
                        </div>
                    </div>

                    <div class="form-group">
                        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                            <input type="checkbox" id="instr-one-shot">
                            One-shot (disable after first trigger)
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn" id="btn-modal-cancel">Cancel</button>
                        <button type="button" class="btn btn-danger" id="btn-modal-delete" style="display:none;">Delete</button>
                        <button type="submit" class="btn btn-primary" id="btn-modal-save">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </template>

    <script src="app.mjs" type="module"></script>
</body>
</html>
