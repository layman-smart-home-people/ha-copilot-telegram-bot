name: Copilot Telegram Bot
description: Always-on Telegram bot connected to GitHub Copilot CLI via ACP
slug: copilot-telegram-bot
url: https://github.com/layman-smart-home-people/ha-copilot-telegram-bot
version: 1.8.0
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: mdi:robot-outline
panel_title: Copilot Bot
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - share:rw
  - config:rw
  - media:rw
  - ssl:ro
options:
  bot_token: ""
  allowed_chat_ids: []
  github_token: ""
  copilot_binary: auto
  copilot_config_dir: auto
  copilot_extra_args: ""
  preamble: >-
    This message arrived via Telegram. Be concise and mobile-friendly.
    Use markdown (bold, lists, code blocks) — it's auto-converted to Telegram HTML.
    Never use tables. For complex data, save an HTML report to /config/www/ and share the URL.
    You have direct HA access: curl -s http://supervisor/core/api/... -H "Authorization: Bearer $SUPERVISOR_TOKEN".
    If ha-mcp MCP tools are available, prefer those for dashboards.
  auto_start: true
  idle_timeout_minutes: 0
  model: auto
  working_directory: /config
  permission_policy: interactive
  group_mode: mention
  allowed_groups: []
  max_group_members: 50
  agent_dir: /config/copilot-telegram-bot
  log_level: info
  pool_size: 5
  pool_pre_warm: 1
  pool_idle_minutes: 5
  pool_wait_timeout_seconds: 30
  default_model: standard
  dispatcher_model: ""
  guest_model: fast
  si_default_model: standard
  dm_topics_enabled: false
  dm_topics:
    - "🏠 Home Control"
    - "🔍 Research"
    - "🚨 Alerts"
    - "📋 Briefings"
  streaming_transport: auto
schema:
  bot_token: password
  allowed_chat_ids:
    - str
  github_token: password?
  copilot_binary: str
  copilot_config_dir: str
  copilot_extra_args: str
  preamble: str
  auto_start: bool
  idle_timeout_minutes: int(0,1440)
  model: str
  working_directory: str
  permission_policy: "list(allow_all|interactive)?"
  group_mode: "list(mention|all)?"
  allowed_groups:
    - str
  max_group_members: int(1,1000)?
  agent_dir: str
  log_level: "list(debug|info|warn|error)?"
  pool_size: int(1,10)?
  pool_pre_warm: int(0,10)?
  pool_idle_minutes: int(1,60)?
  pool_wait_timeout_seconds: int(5,120)?
  default_model: "list(fast|standard|reasoning)?"
  dispatcher_model: "str?"
  guest_model: "list(fast|standard|reasoning)?"
  si_default_model: "list(fast|standard|reasoning)?"
  dm_topics_enabled: bool?
  dm_topics:
    - str
  streaming_transport: "list(auto|draft|edit|off)?"
