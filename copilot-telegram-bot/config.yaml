name: Copilot Telegram Bot
description: Always-on Telegram bot connected to GitHub Copilot CLI via ACP
slug: copilot-telegram-bot
url: https://github.com/layman-smart-home-people/ha-copilot-telegram-bot
version: 0.10.7
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
map:
  - share:rw
  - config:rw
  - media:rw
  - ssl:ro
options:
  bot_token: ""
  allowed_chat_ids: []
  github_token: ""
  copilot_binary: /share/copilot-tools/copilot
  copilot_config_dir: /share/copilot-tools/.copilot
  copilot_extra_args: ""
  preamble: >-
    This message arrived via Telegram. Be concise and mobile-friendly.
    Use markdown (bold, lists, code blocks) — it's auto-converted to Telegram HTML.
    Never use tables. For complex data, save an HTML report to /config/www/ and share the URL.
  auto_start: true
  idle_timeout_minutes: 0
  model: auto
  working_directory: /config
  permission_policy: interactive
schema:
  bot_token: str
  allowed_chat_ids:
    - str
  github_token: str?
  copilot_binary: str
  copilot_config_dir: str
  copilot_extra_args: str
  preamble: str
  auto_start: bool
  idle_timeout_minutes: int(0,1440)
  model: str
  working_directory: str
  permission_policy: "list(allow_all|interactive)?"
