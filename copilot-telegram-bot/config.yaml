name: Copilot Telegram Bot
description: Always-on Telegram bot connected to GitHub Copilot CLI via ACP
slug: copilot-telegram-bot
url: https://github.com/layman-smart-home-people/ha-copilot-telegram-bot
version: 0.1.1
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - share:rw
  - config:rw
  - media:rw
  - ssl:ro
options:
  bot_token: ""
  allowed_chat_ids: []
  copilot_binary: /share/copilot-tools/copilot
  copilot_config_dir: /share/copilot-tools/.copilot
  copilot_extra_args: ""
  preamble: |
    Be concise, mobile-first, Telegram-friendly PLAIN TEXT only.
    Emoji are encouraged for visual hierarchy.
    NEVER use markdown tables — Telegram cannot render them.
    Keep answers short. Aim for under 300 words unless the user explicitly asks for detail.
  auto_start: true
  idle_timeout_minutes: 0
  model: ""
  working_directory: /config
schema:
  bot_token: str
  allowed_chat_ids: list(int)
  copilot_binary: str
  copilot_config_dir: str
  copilot_extra_args: str
  preamble: str
  auto_start: bool
  idle_timeout_minutes: int(0,1440)
  model: str
  working_directory: str
